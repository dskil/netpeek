name: lint

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Byte-compile every module
        run: python -m compileall -q netpeek

      - name: Ruff (errors only)
        run: ruff check --select E9,F63,F7,F82 netpeek tests
