name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # A job that hangs used to sit for 6 hours and hold a macOS runner,
    # which blocked the whole queue. Fail fast instead.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are ~10x slower to be assigned than Linux/Windows and
        # frequently time out mid-job, so they get a single, narrow lane:
        # latest Python only, testing that the platform works at all.
        # Ubuntu and Windows cover the full version range.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.9"
          - os: macos-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        timeout-minutes: 5
        run: python -m pytest -q

      - name: Both command names work
        shell: bash
        run: |
          netpeek --help
          fsociety --help
          netpeek version
          fsociety version
          netpeek me --ip --no-color | head -n 5
          fsociety me --ip --no-color | head -n 5

      - name: Help of every command renders
        shell: bash
        run: |
          for cmd in me scan ports banner subnet dns myip whois tls audit score \
                     firewall updates report export diff watch history init \
                     config update version; do
            netpeek "$cmd" --help > /dev/null
            fsociety "$cmd" --help > /dev/null
          done

      - name: Guard refuses foreign targets
        shell: bash
        run: |
          if netpeek ports 8.8.8.8 --no-color; then
            echo "ERROR: guard allowed a public IP"; exit 1
          else
            echo "guard refused 8.8.8.8 as expected"
          fi
