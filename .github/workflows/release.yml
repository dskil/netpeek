name: release

# Publish to PyPI when a version tag is pushed.
#
#   1. bump the version in pyproject.toml and netpeek/__init__.py
#   2. update CHANGELOG.md
#   3. git tag v1.2.3 && git push origin v1.2.3
#
# Trusted publishing (no API token in the repo):
#   PyPI -> Account -> Publishing -> Add a new pending publisher
#     Owner        : dskil
#     Repository   : netpeek
#     Workflow name: release.yml
#     Environment  : pypi
#
# The build job uploads the artefacts; the publish job receives the OIDC
# token from PyPI and runs in the `pypi` environment, so the workflow file
# name and environment must match what is registered on PyPI.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Check the distribution
        run: python -m twine check dist/*

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/netpeek version
          /tmp/check/bin/fsociety version
          /tmp/check/bin/netpeek --help > /dev/null
          /tmp/check/bin/fsociety me --help > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only a real tag triggers an upload; workflow_dispatch stops after build.
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/netpeek
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Install with a single command:

            ```bash
            pipx install netpeek      # isolated, recommended
            pip install netpeek       # into the active environment
            ```

            Both `netpeek` and `fsociety` are installed by the same package.
