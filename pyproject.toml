[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netpeek"
version = "1.0.0"
description = "NetPeek / fsociety — a legal, read-only look at your own network: who is connected, your IP/MAC/DNS, listening ports and a security report."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dskil", email = "claudedskil@gmail.com" }]
keywords = ["network", "lan", "security", "audit", "arp", "dns", "cli", "ethical-hacking"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
# Better `dns` command: MX, NS, TXT, CNAME and DKIM selectors.
dns = ["dnspython>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
netpeek = "netpeek.main:run"
fsociety = "netpeek.main:run"

[project.urls]
Homepage = "https://github.com/dskil/netpeek"
Repository = "https://github.com/dskil/netpeek"
Issues = "https://github.com/dskil/netpeek/issues"

[tool.setuptools.packages.find]
include = ["netpeek*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
